<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="face" cx="38%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#f5b692"/>
      <stop offset="55%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#a64f33"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a6e" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#ff8a6e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark rounded backdrop -->
  <rect width="64" height="64" rx="14" fill="#0a0807"/>

  <!-- face -->
  <circle cx="32" cy="33" r="22" fill="url(#face)"/>

  <!-- soft top highlight -->
  <ellipse cx="22" cy="20" rx="9" ry="5" fill="#fff" opacity=".22"/>

  <!-- blush -->
  <circle cx="18" cy="38" r="5" fill="url(#blush)"/>
  <circle cx="46" cy="38" r="5" fill="url(#blush)"/>

  <!-- eyes -->
  <circle cx="25" cy="30" r="2.6" fill="#1a0e08"/>
  <circle cx="25.7" cy="29" r="0.9" fill="#fff"/>
  <circle cx="39" cy="30" r="2.6" fill="#1a0e08"/>
  <circle cx="39.7" cy="29" r="0.9" fill="#fff"/>

  <!-- smile -->
  <path d="M24 39 Q32 45 40 39" stroke="#1a0e08" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- sparkle -->
  <g transform="translate(50,15)" fill="#f5b692">
    <path d="M0 -4 L1 -1 L4 0 L1 1 L0 4 L-1 1 L-4 0 L-1 -1 Z"/>
  </g>
</svg>
